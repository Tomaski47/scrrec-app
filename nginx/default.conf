server {
  listen 80;
  server_name localhost;
  # TLS terminates at the edge. Keep directory redirects on the visitor's scheme.
  absolute_redirect off;

  # Cloudflare preserves the original visitor scheme even through an HTTPS tunnel.
  # Direct localhost probes have no CF-Visitor header and remain available.
  if ($http_cf_visitor ~ '"scheme"\s*:\s*"http"') {
    return 308 https://$host$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /version.json {
    expires -1;
  }

  location = /index.html {
    expires -1;
  }

  # Retired release candidates and research pages must not fall back to the app.
  location ~* ^/(?:recorder-preview|transcription-preview|release-check|experiments)(?:/|$) {
    return 404;
  }

  location ~* ^/(?:whisper-test|test-whisper)(?:[./-]|$) {
    return 404;
  }

  location ~* ^/review/transcription-recovery-[ab](?:/|$) {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?)$ {
    try_files $uri =404;
    expires 6M;
    access_log off;
  }

  # Keep all add_header directives at this level so assets inherit them too.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
  add_header Strict-Transport-Security "max-age=86400" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
