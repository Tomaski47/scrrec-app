<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Screen Recorder">
  <defs>
    <linearGradient id="frame" x1="6" y1="7" x2="58" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30ffd7"/>
      <stop offset="0.48" stop-color="#35a8ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <linearGradient id="tile" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090a10"/>
      <stop offset="0.56" stop-color="#101623"/>
      <stop offset="1" stop-color="#17101d"/>
    </linearGradient>
    <linearGradient id="letter" x1="17" y1="15" x2="48" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eafffb"/>
      <stop offset="0.52" stop-color="#d9efff"/>
      <stop offset="1" stop-color="#ffe5fb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#frame)" filter="url(#glow)"/>
  <rect x="7" y="7" width="50" height="50" rx="9" fill="url(#tile)"/>
  <text x="31" y="45" fill="url(#letter)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="900" text-anchor="middle">S</text>
  <circle cx="48" cy="47" r="6" fill="#ff4fd8"/>
  <circle cx="48" cy="47" r="2.2" fill="#101114"/>
</svg>
