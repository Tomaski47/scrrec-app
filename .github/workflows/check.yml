name: Check
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:experiments
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-recorder-${{ github.sha }}
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcription-lab-${{ github.sha }}
          path: output/transcription-lab/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg BUILD_REVISION=${{ github.sha }} -t screen-recorder:check .
      - run: |
          docker run --rm -d --name screen-recorder-check -p 8080:80 screen-recorder:check
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8080/version.json
          curl --fail --silent -D /tmp/headers http://localhost:8080/favicon.svg -o /dev/null
          grep -qi 'x-content-type-options: nosniff' /tmp/headers
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:8080/missing.js)" = 404
          for path in recorder-preview/local-8-710e39f/ transcription-preview/iphone-2/ release-check/ experiments/transcription.html whisper-test.html; do
            test "$(curl --silent -o /dev/null -w '%{http_code}' "http://localhost:8080/$path")" = 404
          done
          curl --silent -D /tmp/redirect http://localhost:8080/og -o /dev/null
          grep -qi 'location: /og/' /tmp/redirect
          test "$(curl --silent -H 'CF-Visitor: {"scheme":"http"}' -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 308
      - if: always()
        run: docker rm -f screen-recorder-check || true
